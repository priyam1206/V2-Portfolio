name: Add Luna portfolio video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-luna-video.yml'

permissions:
  contents: write

jobs:
  patch-luna-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Luna YouTube background
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')

          if 'id="luna-video-bg-container"' in text:
              print('Luna video already present; no change needed.')
              raise SystemExit(0)

          marker = '<div id="luna-animation-wrapper"'
          marker_index = text.index(marker)
          start = text.rfind('            <div class="project-row">', 0, marker_index)
          end = text.index('            <!-- PERSONAL VOICE TTS -->', marker_index)

          if start == -1:
              raise RuntimeError('Could not locate Luna project row start.')

          block = text[start:end]
          row_open = (
              '            <div class="project-row" id="luna-project-row" style="position: relative; overflow: visible;">\n'
              '                <div id="luna-video-bg-container" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 100vw; height: 100%; overflow: hidden; z-index: 0; pointer-events: none;">\n'
              '                    <iframe src="https://www.youtube.com/embed/SW7m6Dh-9ng?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&loop=1&playlist=SW7m6Dh-9ng&disablekb=1&modestbranding=1&playsinline=1" title="Luna demo video" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" loading="lazy" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.3); width: 100vw; height: 56.25vw; min-height: 100%; min-width: 177.77vh; pointer-events: none;"></iframe>\n'
              '                </div>\n'
              '                <div class="luna-video-overlay" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 100vw; height: 100%; background: rgba(5, 5, 5, 0.75); z-index: 1; pointer-events: none;"></div>\n\n'
          )

          block = block.replace('            <div class="project-row">\n', row_open, 1)
          block = block.replace('                <div class="project-info">', '                <div class="project-info" style="position: relative; z-index: 2;">', 1)
          block = block.replace('                <div class="project-tags">', '                <div class="project-tags" style="position: relative; z-index: 2;">', 1)

          updated = text[:start] + block + text[end:]
          path.write_text(updated, encoding='utf-8')
          print('Added Luna background video SW7m6Dh-9ng.')
          PY

      - name: Commit portfolio update
        shell: bash
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "No portfolio changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Add Luna demo video to portfolio"
          git push
