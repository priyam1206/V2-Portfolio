name: MailMate transparent logo fix once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'apply-mailmate-transparent-mark' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace boxed MailMate logo with transparent mark
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '''        .mm-logo {
              width: 82%;
              height: 82%;
              display: block;
              object-fit: contain;
              border-radius: 26%;
              transform: translateZ(35px);
              filter: drop-shadow(0 28px 42px rgba(0,0,0,.48));
              user-select: none;
              -webkit-user-drag: none;
          }'''

          new_css = '''        .mm-logo {
              width: 58%;
              height: 58%;
              display: block;
              object-fit: contain;
              border-radius: 0;
              transform: translateZ(35px);
              filter: drop-shadow(0 18px 30px rgba(0,0,0,.38));
              user-select: none;
              -webkit-user-drag: none;
          }'''

          old_img = '<img class="mm-logo" src="https://raw.githubusercontent.com/sphereofrupayan/CipherSquad/main/assets/images/cs_logo.png" alt="MailMate logo" loading="lazy" decoding="async">'
          new_img = '<img class="mm-logo" src="./images/mailmate-mark.svg?v=1" alt="MailMate logo" loading="lazy" decoding="async">'

          if old_css not in text:
              raise SystemExit('Expected MailMate CSS block not found')
          if old_img not in text:
              raise SystemExit('Expected MailMate image tag not found')

          text = text.replace(old_css, new_css, 1)
          text = text.replace(old_img, new_img, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit logo fix
        run: |
          git config user.name "Priyam Trivedi"
          git config user.email "128762847+priyam1206@users.noreply.github.com"
          git add docs/index.html
          git commit -m "fix: use transparent MailMate mark"
          git push
