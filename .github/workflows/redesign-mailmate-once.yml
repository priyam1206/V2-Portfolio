name: Redesign MailMate showcase once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  redesign:
    if: github.event.head_commit.message == 'trigger-mailmate-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch MailMate showcase
        run: python tools/redesign_mailmate.py

      - name: Commit redesigned portfolio
        run: |
          git config user.name "Priyam Trivedi"
          git config user.email "128762847+priyam1206@users.noreply.github.com"
          git add docs/index.html
          git commit -m "feat: rebuild MailMate portfolio showcase"
          git push
