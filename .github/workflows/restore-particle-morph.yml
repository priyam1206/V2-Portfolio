name: Restore particle morph

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original particle engine once
        shell: bash
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [ "$message" != "chore: retry particle morph restore" ]; then
            echo "Not the restore trigger commit; nothing to do."
            exit 0
          fi

          curl -fsSL "https://raw.githubusercontent.com/priyam1206/V2-Portfolio/0f09d28eb4ce015e91be43856601b494c201bb25/docs/index.html" -o /tmp/index.html
          sed -i 's#</head>#    <link rel="stylesheet" href="./mailmate-priyn-layout.css?v=3">\n</head>#' /tmp/index.html
          mv /tmp/index.html docs/index.html

          git config user.name "Priyam Trivedi"
          git config user.email "128762847+priyam1206@users.noreply.github.com"
          git add docs/index.html
          git commit -m "fix: restore original dot particle morph engine"
          git push origin HEAD:main
